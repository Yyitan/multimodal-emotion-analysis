seed: 20260923
device: auto
data:
  aligned_path: data/features_aligned/aligned_50.pkl
  train_split: train
  valid_split: valid
  test_split: test
model:
  type: gated
  modalities:
  - text
  - audio
  - vision
  hidden_dim: 64
  dropout: 0.2
training:
  epochs: 12
  batch_size: 32
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0
  classification_weight: 1.0
  regression_weight: 1.0
  consistency_weight: 0.2
  selection_weights:
    macro_f1: 0.35
    accuracy: 0.15
    pearson: 0.25
    mae: 0.25
  augmentation:
    enabled: true
    probability: 0.6
    min_fraction: 0.1
    max_fraction: 0.4
    modalities:
    - text
    - audio
    - vision
output:
  checkpoint: artifacts/models/model_gated_seed20260923.pt
  metrics: artifacts/metrics/model_gated_seed20260923_training.json
