# Lightweight interface check only; outputs go under runs/ and are not paper results.
seed: 20260923
device: cpu

data:
  aligned_path: data/features_aligned/aligned_50.pkl

models:
  - name: gated_seed2026_smoke
    family: gated
    role: primary
    seed: 2026
    checkpoint: artifacts/models/model_gated_seed2026.pt

evaluation:
  batch_size: 8
  num_workers: 0
statistics:
  bootstrap_resamples: 50
  confidence: 0.95
validation_grid:
  modalities: [T, AV, TAV]
  missing_rates: [0, 0.3]
  positions: [head, random]
  span_counts: [1, 3]
test_grid:
  modalities: [T, A, V, TA, TV, AV, TAV]
  missing_rates: [0, 0.1, 0.2, 0.3, 0.5, 0.7]
  positions: [random]
  span_counts: [1]
smoke:
  max_samples: 8
  max_conditions: 4
  bootstrap_resamples: 30
summary:
  primary_family: gated
  figure_split: valid
output:
  metrics_dir: artifacts/metrics
  figures_dir: artifacts/figures
