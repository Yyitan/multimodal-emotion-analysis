seed: 2026
device: auto

data:
  aligned_path: data/features_aligned/aligned_50.pkl
  train_split: train
  valid_split: valid
  test_split: test

model:
  type: gated
  modalities: [text, audio, vision]
  hidden_dim: 64
  dropout: 0.20

training:
  epochs: 12
  batch_size: 32
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0
  classification_weight: 1.0
  regression_weight: 1.0
  consistency_weight: 0.20
  # Fixed before test evaluation; all components are normalized to [0, 1].
  selection_weights:
    macro_f1: 0.35
    accuracy: 0.15
    pearson: 0.25
    mae: 0.25
  augmentation:
    enabled: true
    probability: 0.60
    min_fraction: 0.10
    max_fraction: 0.40
    modalities: [text, audio, vision]

output:
  checkpoint: artifacts/models/gated_multitask.pt
  metrics: artifacts/metrics/gated_training.json
