name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-direct.txt
      - run: pytest -q tests/test_models.py tests/test_explain_core.py tests/test_statistics.py
